name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 同時只跑一個部署，但不取消進行中的（避免部署到一半被砍）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          # repo 叫 <owner>.github.io 的話網站掛在根路徑，BASE_PATH 要是 /；
          # 其他名字則是專案頁，掛在 /<repo> 底下。判斷錯的話全站連結與圖片都會 404。
          BASE_PATH: ${{ vars.BASE_PATH || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}', github.event.repository.name)) }}
        run: npm run build

      # gh-pages 只保留一個無歷史快照，作為正式站與 PR preview 的共同內容倉庫。
      # 第一次執行時先建立分支；後續正式部署會用 dist 完整覆蓋，順便清掉所有 preview。
      - name: Ensure gh-pages branch exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/heads/gh-pages' \
              -f sha="$GITHUB_SHA"
          fi

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site
          fetch-depth: 1

      - name: Replace published snapshot
        run: |
          git -C _site switch --orphan publish-snapshot
          rsync -a --delete --exclude='.git/' dist/ _site/
          touch _site/.nojekyll
          git -C _site add -A
          git -C _site -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Deploy ${GITHUB_SHA}"
          git -C _site push --force origin HEAD:gh-pages
          rm -rf -- _site/.git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
